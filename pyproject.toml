[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tom-home-server"
version = "0.1.0"
description = "A small Ubuntu home server for isolated OpenClaw assistants"
requires-python = ">=3.11"
dependencies = [
  "aiohttp==3.14.5",
  "cryptography==50.0.2",
  "PyJWT==2.15.1",
  "docker==7.2.0",
  "dnslib==0.9.26",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "pytest-aiohttp==1.1.0", "ruff==0.14.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["tom*"]

[tool.setuptools.package-data]
tom = ["static/*"]
